<style>

h1{font-size:clamp(28px,8vw,40px);line-height:1.05;margin:14px 0 8px;color:var(--rust)}

.sm-foot{text-align:center;font:12px/1.4 system-ui,sans-serif;color:#6b6252;margin:0;padding:8px 16px 36px}.sm-foot a{color:inherit}
  .ctt-shops-tip { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; text-align: center; margin-top: 24px; padding-top: 14px; border-top: 1.5px dashed var(--line); font-family: 'Libre Franklin', sans-serif; font-size: 13px; color: #6b6252; }
  .ctt-shops-tip a { font-weight: 700; color: var(--olive); border: 1px solid var(--olive); border-radius: 14px; padding: 5px 13px; text-decoration: none; }
  .ctt-shops-back { display: block; width: 100%; margin-top: 18px; padding: 13px; font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 700; background: var(--olive); color: var(--paper); border: none; border-radius: 6px; cursor: pointer; }
  .ctt-gi-form label { display: block; font-family: 'Libre Franklin', sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); margin: 12px 0 4px; }
  .ctt-gi-form input[type=text], .ctt-gi-form input[type=email], .ctt-gi-form select, .ctt-gi-form textarea { width: 100%; padding: 11px 12px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font-family: 'Libre Franklin', sans-serif; }
  .ctt-gi-form textarea { min-height: 110px; resize: vertical; }
  .ctt-gi-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .ctt-cal-add { display: block; width: 50%; min-width: 170px; margin: 4px auto 10px; padding: 10px 12px; font-family: 'Libre Franklin', sans-serif; font-size: 14px; font-weight: 700; background: var(--olive); color: var(--paper); border: none; border-radius: 999px; cursor: pointer; }
  #cs-send { border-radius: 999px; }
  .ctt-cal-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 15px; margin: 0 0 10px; font-family: 'Libre Franklin', sans-serif; font-size: 14px; color: var(--ink); }
  .ctt-cal-card h4 { font-family: 'Archivo Black', sans-serif; font-size: 17px; margin: 0 0 3px; }
  .ctt-cal-card p { margin: 3px 0; }
  .ctt-cal-date { font-weight: 700; color: var(--rust); }
  .ctt-cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 14px; font-family: 'Libre Franklin', sans-serif; }
  .ctt-cal-month { font-family: 'Archivo Black', sans-serif; font-size: 19px; text-align: center; flex: 1; }
  .ctt-cal-arrow { min-width: 44px; min-height: 44px; font-size: 20px; font-weight: 700; color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 8px; cursor: pointer; }
  .ctt-cal-arrow:disabled { opacity: .3; cursor: default; }
  .ctt-cal-today { font-family: 'Libre Franklin', sans-serif; font-size: 13px; font-weight: 700; color: var(--rust); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px 6px; }
  .ctt-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; touch-action: pan-y; }
  .ctt-cal-dow { text-align: center; font-family: 'Libre Franklin', sans-serif; font-size: 11px; font-weight: 700; color: #6b6252; padding: 4px 0 2px; }
  .ctt-cal-cell { min-height: 62px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px; font-family: 'Libre Franklin', sans-serif; font-size: 14px; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ctt-cal-titles { display: none; width: 100%; font-size: 10.5px; line-height: 1.2; font-weight: 600; text-align: center; margin-top: 2px; }
  .ctt-cal-titles span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .ctt-cal-titles .ctt-cal-more { font-weight: 700; text-decoration: underline; }
  @media (min-width: 700px) { .ctt-cal-titles { display: block; } .ctt-cal-cell { min-height: 92px; justify-content: flex-start; } }
  .ctt-cal-cell.blank { background: none; border: none; cursor: default; }
  .ctt-cal-cell.today { border: 2.5px solid var(--rust); font-weight: 700; }
  .ctt-cal-cell.sel { background: #2c3e44; color: #fff; }
  .ctt-cal-cell:focus-visible, .ctt-cal-arrow:focus-visible { outline: 3px solid var(--rust); outline-offset: 2px; }
  .ctt-cal-marks { font-size: 11px; line-height: 1; letter-spacing: 1px; }
  .ctt-cal-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; font-family: 'Libre Franklin', sans-serif; font-size: 12.5px; color: #6b6252; margin: 14px 0 6px; }
  .ctt-cal-listhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: 'Archivo Black', sans-serif; font-size: 16px; margin: 22px 0 10px; }
  .ctt-cal-all { font-family: 'Libre Franklin', sans-serif; font-size: 13px; font-weight: 700; color: var(--rust); background: none; border: none; text-decoration: underline; cursor: pointer; }
  .ctt-cal-tag { display: inline-block; font-family: 'Libre Franklin', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border: 1.5px solid var(--ink); border-radius: 10px; padding: 1px 8px; margin-bottom: 4px; }
  .ctt-cal-card.special { background: var(--paper); border-style: dashed; }
  @media (min-width: 700px) { .ctt-cal-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-items: start; } }
  .ctt-cal-card a { color: var(--rust); }
  .ctt-cal-rep { background: none; border: none; padding: 0; margin-top: 4px; font-family: 'Libre Franklin', sans-serif; font-size: 12px; color: #6b6252; text-decoration: underline; cursor: pointer; }
  .ctt-cal-empty { text-align: center; font-family: 'Libre Franklin', sans-serif; color: #6b6252; margin: 20px 0; }
  .ctt-cal-check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400 !important; }
  .ctt-cal-check input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
#ctt-cal-formwrap{margin-bottom:14px}.ctt-calsub{font-family:system-ui,sans-serif;font-size:14px;color:var(--taupe);margin:0 0 10px}

.np-mast{text-align:center;border-top:4px double var(--ink);border-bottom:4px double var(--ink);padding:10px 0 8px;margin:6px 0 18px}
.np-mast h1{margin:0;color:var(--ink);font-size:clamp(34px,10vw,56px);letter-spacing:.01em}
.np-dateline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--taupe);border-top:1px solid var(--ink);margin-top:8px;padding-top:6px}
.np-kick{font-family:system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);margin:0 0 4px}
.np-lead{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1.5px solid var(--ink)}
.np-lead img{width:100%;aspect-ratio:1200/630;object-fit:cover;border:1px solid var(--line);border-radius:4px;display:block}
.np-lead h2{border:0;margin:0 0 10px;padding:0;font-size:clamp(26px,6vw,40px);line-height:1.06}.np-lead p{font-size:17px}
.np-lead p,.np-card p{margin:0 0 8px;font-size:16px}
.np-by{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--taupe)}
.np-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.np-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.np-card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block;margin:0 0 8px}
.np-card h3{font-size:19px;line-height:1.15;margin:0 0 6px}
.np-card a.more,.np-lead a.more{font-family:system-ui,sans-serif;font-size:13.5px;font-weight:700;color:var(--rust);text-decoration:none}
.np-card a.more:hover,.np-lead a.more:hover{text-decoration:underline}
.np-press{background:var(--ink);color:var(--paper);border-radius:6px;padding:14px 16px;margin:0 0 18px}
.np-press .np-kick{color:#d4a72c}.np-press h3{color:var(--paper);margin:0 0 4px}.np-press p{margin:0 0 8px;font-size:15.5px}.np-press a{color:#f5e2bc}
.np-sec{font-size:20px;margin:22px 0 10px;border-bottom:1.5px solid var(--ink);padding-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
@media(max-width:620px){.np-lead{grid-template-columns:1fr}.np-grid{grid-template-columns:1fr}}
</style></head><body><div class="topbar"><a class="sitetitle" href="/"><picture><source media="(max-width: 600px)" srcset="/ctt-title-stacked.webp"><img class="ctt-title-img" src="/ctt-title-wide.webp" alt="Chattanooga Thrift Trail" width="1400" height="134" style="display:block;height:auto;max-width:100%"></picture></a><button type="button" class="sm-btn" id="sm-btn" aria-label="Menu" aria-expanded="false" aria-controls="sm-menu"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 6h20M3 13h20M3 20h20" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button><nav class="sm-menu" id="sm-menu" aria-label="Menu" hidden><a href="/">🗺️ Trail Map</a><a href="/shops/">🛍️ Shops &amp; Charities</a><a href="/calendar/">📅 Community Calendar</a><a href="/how-to/">📖 How It Works</a><a href="/blog/">📝 Blog</a><a href="/#ctt-news">📬 Newsletter</a></nav></div><div class="wrap">
<div class="np-mast"><h1>Trail News</h1><div class="np-dateline"><span id="np-date"></span><span>Chattanooga, Tennessee</span></div></div>
<div id="np-press"></div>
<div id="np-lead"></div>
<div id="np-grid" class="np-grid"></div>
</div>
<p class="sm-foot">Site sponsored by <a href="https://www.instagram.com/thethriftyflea" target="_blank" rel="noopener">Thrifty Flea</a></p><script src="/menu.js" defer></script>
<script>
/* Trail News. pin:true = the one full-width Big News story at the top (otherwise the newest story is used); the rest run in two columns, newest first. kind: "press" = a feature about the Trail (shows in the dark Thank You band), "trail" or "shop" = a story card.
   Fields: date (YYYY-MM-DD), kind, kicker, title, text, img (optional photo path), link (optional), linkText (optional), by (optional source line). */
var NEWS = [
  { date: "2026-11-18", kind: "trail", pin: true, kicker: "Big News &middot; In The Chattanoogan", title: "New Chattanooga Thrift Trail Website Is \u201cLabor Of Love\u201d", text: "The Chattanoogan has featured the Thrift Trail: a new website that maps more than 50 thrift shops, vintage shops and antique malls across Chattanooga and nearby North Georgia. Enter your location, pick a route, and get a driving plan built around shop hours, with no app or account needed. Thank you to The Chattanoogan for sharing the Trail with the community.", img: "/og-image.png", link: "https://www.chattanoogan.com/2026/11/18/526296/New-Chattanooga-Thrift-Trail-Website.aspx", linkText: "Read It In The Chattanoogan", by: "The Chattanoogan" },
  { date: "2026-11-18", kind: "trail", kicker: "On the Trail", title: "Every Shop Now Links to Its Google Listing", text: "Tap Google Listing on any shop card, on the map or on the Shops & Charities page, to see its hours, photos and reviews right on Google Maps. Social links are being added shop by shop.", link: "/shops/", linkText: "See the Shops", by: "From the Mod" },
  { date: "2026-11-18", kind: "trail", kicker: "On the Trail", title: "Trail News Has Opened", text: "Shop sales, new small businesses, events and every time the Thrift Trail makes the news will land here. Have news from your shop? Send it through the shop update form.", link: "/shops/update/", linkText: "Send Shop News", by: "From the Mod" }
];
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pretty(d){var p=d.split('-'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[+p[1]-1]+' '+(+p[2])+', '+p[0];}
  try{document.getElementById('np-date').textContent=new Date().toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch(e){}
  NEWS.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
  var press=NEWS.filter(function(n){return n.kind==='press';}), stories=NEWS.filter(function(n){return n.kind!=='press';});
  function more(n){return n.link?'<a class="more" href="'+esc(n.link)+'"'+(/^https?:/.test(n.link)?' target="_blank" rel="noopener"':'')+'>'+esc(n.linkText||'Read More')+' &rarr;</a>':'';}
  document.getElementById('np-press').innerHTML=press.map(function(n){return '<div class="np-press"><p class="np-kick">Thank You</p><h3>'+esc(n.title)+'</h3><p>'+esc(n.text)+'</p>'+more(n)+'</div>';}).join('');
  var lead=stories.filter(function(n){return n.pin;})[0]||stories[0], rest=stories.filter(function(n){return n!==lead;});
  if(lead)document.getElementById('np-lead').innerHTML='<article class="np-lead">'+(lead.img?'<img src="'+esc(lead.img)+'" alt="" width="1200" height="630">':'')+'<div><p class="np-kick">'+(lead.kicker||'')+'</p><h2>'+esc(lead.title)+'</h2><p>'+esc(lead.text)+'</p><p class="np-by">'+esc(lead.by||'')+' &middot; '+pretty(lead.date)+'</p>'+more(lead)+'</div></article>';
  document.getElementById('np-grid').innerHTML=rest.map(function(n){return '<article class="np-card">'+(n.img?'<img src="'+esc(n.img)+'" alt="" loading="lazy">':'')+'<p class="np-kick">'+esc(n.kicker||'')+'</p><h3>'+esc(n.title)+'</h3><p>'+esc(n.text)+'</p><p class="np-by">'+esc(n.by||'')+' &middot; '+pretty(n.date)+'</p>'+more(n)+'</article>';}).join('');
})();
</script>
