<style>

.big{font-size:44px;font-weight:900;margin:6px 0}

<script>
(()=>{

let rs=7;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
const DESKS=[];

const GUMC=['#ff8fc7','#ff8fc7','#7fd3ff','#9be37a','#f2f2f2','#ffd166'],BOOG='#9aa83a',PENS=['rgba(40,40,40,.65)','rgba(30,70,170,.7)','rgba(90,90,90,.55)','rgba(170,30,40,.6)'];
const DTYPES=['smile','heart','star','ttt','bolt','hi','smile','heart'];
function deskMarks(d){const r=Math.random,u=()=>(r()*2-1);
  d.gum=[];if(r()<.7){const n=1+Math.floor(r()*3);for(let i=0;i<n;i++){const boog=r()<.4;d.gum.push({u:u()*.85,v:u()*.8,r:boog?.007+r()*.008:.012+r()*.016,c:boog?BOOG:pick(GUMC),b:boog});}}

function doodle(t){const L=[],circ=(cx0,cy0,rr,a0=0,a1=Math.PI*2,n=14)=>{const q=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;q.push([cx0+Math.cos(a)*rr,cy0+Math.sin(a)*rr]);}return q;};

    for(const pl of doodle(g.t))for(let i=1;i<pl.length;i++){const a=pl[i-1],b=pl[i];
      const P1=[bx0+(a[0]*cs-a[1]*sn)*g.sc,.7465,bz0+(a[0]*sn+a[1]*cs)*g.sc],P2=[bx0+(b[0]*cs-b[1]*sn)*g.sc,.7465,bz0+(b[0]*sn+b[1]*cs)*g.sc];line3(P1,P2,g.c,1.7);}}
  if(cy<.7&&d.gum)for(const m of d.gum){const p=pr(gx+m.u*hw,.698,gz+m.v*hd),k=p[2];
    ctx.fillStyle=m.c;ctx.beginPath();ctx.ellipse(p[0],p[1],m.r*k,m.r*k*.7,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(p[0]+m.r*k*.2,p[1]+m.r*k*.25,m.r*k*.6,m.r*k*.35,0,0,7);ctx.fill();
    if(m.b){ctx.fillStyle='rgba(255,255,200,.35)';ctx.beginPath();ctx.arc(p[0]-m.r*k*.3,p[1]-m.r*k*.2,m.r*k*.3,0,7);ctx.fill();}
    else{ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(p[0]-m.r*k*.35,p[1]-m.r*k*.25,m.r*k*.25,0,7);ctx.fill();}}}
function shuffleKids(){const start=deskAt(2,0);for(const d of DESKS){const k=d.row>0&&Math.random()<.62;d.kid=k?makeKid():null;d.bag=!k&&Math.random()<.45;d.book=Math.random()<.45;deskMarks(d);}
  // guarantee at least one open desk (besides Jackson's) in every row and every column
  const ensure=list=>{const open=list.filter(d=>d!==start&&!d.kid);if(!open.length){const c=pick(list.filter(d=>d!==start));c.kid=null;c.bag=Math.random()<.45;}};
  for(let r=0;r<ROWS.length;r++)ensure(DESKS.filter(d=>d.row===r));
  for(let c=0;c<COLS.length;c++)ensure(DESKS.filter(d=>d.col===c));}
let seat=deskAt(2,0),SX=seat.x,SZ=seat.z-.75,moving=false,pu=null,puT=9,path=[],queued=null;const PX=()=>SX+P.x;
const WIN_DODGES=50;let boardOtter=false,cheer=false,WT=0,PRIN=null,OTTER=null,winStep=0;
const DOOR=[3.6,9.15];
function walkTo(o,tx,tz,sp,dt){const dx=tx-o.x,dz=tz-o.z,d=Math.hypot(dx,dz);o.walk=(o.walk||0)+dt*7;if(d<sp*dt){o.x=tx;o.z=tz;return true;}o.x+=dx/d*sp*dt;o.z+=dz/d*sp*dt;return false;}
let duckT=0,duckLock=false,poopSeen=false,poopPU=null,poopT=6,ammo=0,poops=[],rHits=0;const R_HITS=3;
let fartAt=30,farted=false,laughT=0,puffs=[];
function drawPoop2D(cx0,cy0,r){ // stacked swirl, r = radius in px
  ctx.fillStyle='#6b3e1f';
  ctx.beginPath();ctx.ellipse(cx0,cy0,r,r*.45,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx0,cy0-r*.45,r*.75,r*.36,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx0,cy0-r*.82,r*.48,r*.28,0,0,7);ctx.fill();

function drawPoopPU(d){
  const t=performance.now()/1000,bob=Math.sin(t*4)*.015,p=pr(d.x,.75+.06+bob,d.z),k=p[2];
  const g=pr(d.x,.8,d.z);ctx.fillStyle='rgba(255,230,150,'+(.18+.1*Math.sin(t*6))+')';ctx.beginPath();ctx.ellipse(g[0],g[1],.3*g[2],.12*g[2],0,0,7);ctx.fill();

}
function aimLane(){return Math.max(-1.9,Math.min(2.1,PX()));}
function throwPoop(){
  if(state!=='play')return;

const HB=[.105,.14,.013],L=(()=>{const v=[-.3,.9,-.35],m=Math.hypot(...v);return v.map(a=>a/m);})();

  {i:[1,3,7,5],n:[1,0,0],t:'pages'},{i:[0,1,5,4],n:[0,-1,0],t:'pages'},{i:[2,3,7,6],n:[0,1,0],t:'pages'}];
function rot(x,y,z,b){let c=Math.cos(b.rx),s=Math.sin(b.rx),y1=y*c-z*s,z1=y*s+z*c;y=y1;z=z1;

function drawBook(b){

  for(const f of FACES){
    const n=rot(f.n[0],f.n[1],f.n[2],b);

    if(n[0]*(mx-cx)+n[1]*(my-cy)+n[2]*(mz-camZ)>=0)continue;

      const bl=(u,v)=>[0,1,2].map(k=>q[0][k]*(1-u)*(1-v)+q[1][k]*u*(1-v)+q[2][k]*u*v+q[3][k]*(1-u)*v);

  if(state==='play'&&ammo>0){items.push({z:T.z+.01,f:()=>{const ax=aimLane(),t=performance.now()/1000;
    poly([[ax-.18,0.005,T.z-.18],[ax+.18,0.005,T.z-.18],[ax+.18,0.005,T.z+.18],[ax-.18,0.005,T.z+.18]],null,'rgba(255,209,102,'+(.55+.3*Math.sin(t*6))+')',3);
    line3([ax,0.005,T.z-.3],[ax,0.005,T.z+.3],'rgba(255,209,102,.7)',2);line3([ax-.3,0.005,T.z],[ax+.3,0.005,T.z],'rgba(255,209,102,.7)',2);}});}
  for(const q of poops)items.push({z:q.z,f:()=>{const p=pr(q.x,q.y,q.z);ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(q.r);drawPoop2D(0,0,.07*p[2]);ctx.restore();}});
  items.sort((a,b)=>b.z-a.z);for(const it of items)it.f();
  // lighting / post
  ctx.fillStyle='rgba(255,236,200,.05)';ctx.fillRect(0,0,W,H);
  if(flick<1){ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.045;ctx.translate(Math.random()*160,Math.random()*160);ctx.fillStyle=grainPat;ctx.fillRect(-160,-160,W+320,H+320);ctx.restore();
  if(hitT>0){ctx.fillStyle='rgba(190,25,20,'+(hitT*.9)+')';ctx.fillRect(0,0,W,H);}
  // paper bits
  for(const p of parts){ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle='#f6f3ea';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.strokeStyle='rgba(80,120,190,.5)';ctx.lineWidth=1;for(let y=-p.h/2+4;y<p.h/2;y+=4){ctx.beginPath();ctx.moveTo(-p.w/2,y);ctx.lineTo(p.w/2,y);ctx.stroke();}ctx.restore();}
  if(state==='play'||state==='dying')hud();else if(state==='win'&&banner){hud();}
  for(const f of floats){ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='900 '+f.size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y);ctx.restore();}
}
function mapGeom(){const cw=isTouch?34:30,ch=isTouch?28:24,g=5,w=COLS.length*cw+(COLS.length-1)*g+16,h=ROWS.length*ch+(ROWS.length-1)*g+58;return{cw,ch,g,w,h,x:14,y:78};}
function mapHit(mx,my){if(state!=='play')return null;const m=mapGeom();for(const d of DESKS){const r=ROWS.length-1-d.row,x=m.x+8+d.col*(m.cw+m.g),y=m.y+36+r*(m.ch+m.g);
  if(mx>=x&&mx<=x+m.cw&&my>=y&&my<=y+m.ch&&!d.kid&&d!==seat)return d;}return null;}
function drawMap(){const m=mapGeom(),t=performance.now()/1000;ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';rrect(m.x,m.y,m.w,m.h,10);ctx.fill();
  ctx.fillStyle='#2c4537';ctx.fillRect(m.x+8,m.y+8,m.w-16,10);
  ctx.fillStyle='#fff';ctx.font='800 10px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('BOARD  •  MR. R',m.x+m.w/2,m.y+13);
  const tx=m.x+8+((T.x+2.6)/5.2)*(m.w-16);ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(Math.max(m.x+12,Math.min(m.x+m.w-12,tx)),m.y+26,5,0,7);ctx.fill();
  for(const d of DESKS){const r=ROWS.length-1-d.row,x=m.x+8+d.col*(m.cw+m.g),y=m.y+36+r*(m.ch+m.g);
    const hov=mouse&&mapHit(mouse[0],mouse[1])===d;
    if(d===seat){ctx.fillStyle='#ffd166';rrect(x,y,m.cw,m.ch,4);ctx.fill();ctx.fillStyle='#111';ctx.font='900 13px system-ui';ctx.fillText('J',x+m.cw/2,y+m.ch/2+1);}
    else if(d.kid){ctx.fillStyle='rgba(255,255,255,.18)';rrect(x,y,m.cw,m.ch,4);ctx.fill();ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(x+m.cw/2,y+m.ch/2,4,0,7);ctx.fill();}
    else{ctx.fillStyle=hov?'rgba(255,209,102,.5)':'rgba(255,255,255,.06)';rrect(x,y,m.cw,m.ch,4);ctx.fill();
      ctx.strokeStyle=hov?'#ffd166':'rgba(255,255,255,'+(.55+.3*Math.sin(t*4))+')';ctx.lineWidth=2;rrect(x+1,y+1,m.cw-2,m.ch-2,4);ctx.stroke();}
    if(poopPU&&poopPU.d===d&&(poopPU.t>1.5||Math.floor(t*8)%2))drawPoop2D(x+m.cw/2,y+m.ch/2+6,8);
    if(pu&&pu.d===d&&(pu.t>1.5||Math.floor(t*8)%2)){ctx.fillStyle='#fff';ctx.fillRect(x+m.cw/2-7,y+m.ch/2-7,14,14);ctx.fillStyle='#d62828';ctx.fillRect(x+m.cw/2-2,y+m.ch/2-5,4,10);ctx.fillRect(x+m.cw/2-5,y+m.ch/2-2,10,4);}
  }
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='700 10px system-ui,sans-serif';ctx.fillText(isTouch?'TAP AN EMPTY DESK':'CLICK AN EMPTY DESK',m.x+m.w/2,m.y+m.h-8);
  ctx.restore();}
function hud(){
  if(state==='play')drawMap();
  ctx.save();ctx.textBaseline='top';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.8)';
  ctx.font='900 30px system-ui,sans-serif';ctx.textAlign='left';ctx.strokeText('SCORE '+score,18,16);ctx.fillStyle='#fff';ctx.fillText('SCORE '+score,18,16);
  ctx.font='800 16px system-ui,sans-serif';const lv='LEVEL '+level+(seat.row?'   •   x'+(1+seat.row)+' POINTS':'')+(streak>=3?'   •   STREAK '+streak:'');ctx.strokeText(lv,18,52);ctx.fillStyle='#ffd166';ctx.fillText(lv,18,52);
  ctx.textAlign='right';ctx.font='900 32px system-ui,sans-serif';
  {const bw=Math.min(240,W*.38),bh=22,bx=W-18-bw,by=40;
  ctx.font='800 15px system-ui,sans-serif';ctx.strokeText('HEALTH '+Math.ceil(hp),W-18,14);ctx.fillStyle='#fff';ctx.fillText('HEALTH '+Math.ceil(hp),W-18,14);
  ctx.fillStyle='rgba(0,0,0,.6)';rrect(bx-3,by-3,bw+6,bh+6,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(bx,by,bw*hpShown/100,bh);
  ctx.fillStyle=hp>50?'#2ecc71':hp>25?'#f1c40f':'#e74c3c';ctx.fillRect(bx,by,bw*hp/100,bh);
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(bx+bw*i/4,by);ctx.lineTo(bx+bw*i/4,by+bh);ctx.stroke();}
  ctx.strokeStyle='#fff';ctx.lineWidth=2;rrect(bx,by,bw,bh,4);ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';}
  if(state==='play'&&(duckT>0||duckLock)){const bw=160,bx=W/2-bw/2,by=H-78;ctx.fillStyle='rgba(0,0,0,.55)';rrect(bx-3,by-3,bw+6,14,6);ctx.fill();
    ctx.fillStyle=duckLock?'#e74c3c':'#9be7ff';ctx.fillRect(bx,by,bw*Math.max(0,1-duckT/2),8);ctx.textAlign='center';ctx.font='800 12px system-ui,sans-serif';
    const dtx=duckLock?'LET GO OF DUCK TO RESET':'DUCK TIME';ctx.strokeText(dtx,W/2,by-16);ctx.fillStyle='#fff';ctx.fillText(dtx,W/2,by-16);}
  if(state==='play'){ctx.textAlign='left';ctx.font='900 18px system-ui,sans-serif';const front=seat.row===ROWS.length-1&&!moving;
    const at='POOP x'+ammo+(ammo?'  — SPACE TO THROW!':'');const ay=78+mapGeom().h+10;
    drawPoop2D(28,ay+18,10);ctx.strokeText(at,46,ay+4);ctx.fillStyle=ammo?'#ffd166':'#e0b27a';ctx.fillText(at,46,ay+4);
    const hb=Math.min(260,W*.4),hx=W/2-hb/2,hy2=58;ctx.fillStyle='rgba(0,0,0,.55)';rrect(hx-3,hy2-3,hb+6,16,6);ctx.fill();ctx.fillStyle='#e0b27a';ctx.fillRect(hx,hy2,hb*rHits/R_HITS,10);
    ctx.textAlign='center';ctx.font='800 13px system-ui,sans-serif';const ht='POOP HITS ON MR. R: '+rHits+' / '+R_HITS;ctx.strokeText(ht,W/2,hy2+16);ctx.fillStyle='#fff';ctx.fillText(ht,W/2,hy2+16);}
  if(state==='play'){const left=Math.max(0,WIN_DODGES-dodged),bw=Math.min(260,W*.4),bx=W/2-bw/2,by=16;
    ctx.fillStyle='rgba(0,0,0,.55)';rrect(bx-3,by-3,bw+6,16,6);ctx.fill();ctx.fillStyle='#9be7ff';ctx.fillRect(bx,by,bw*Math.min(1,dodged/WIN_DODGES),10);
    ctx.textAlign='center';ctx.font='800 13px system-ui,sans-serif';const tx='DODGE '+left+' MORE UNTIL THE PRINCIPAL COMES';ctx.strokeText(tx,W/2,by+16);ctx.fillStyle='#fff';ctx.fillText(tx,W/2,by+16);}
  if(banner){const a=Math.min(1,banner.t*2,(2.2-banner.t)*4);ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.font='900 '+Math.min(64,W*.12)+'px system-ui,sans-serif';ctx.strokeText(banner.a,W/2,H*.13);ctx.fillStyle='#fff';ctx.fillText(banner.a,W/2,H*.13);
    ctx.font='700 18px system-ui,sans-serif';ctx.strokeText(banner.b,W/2,H*.13+Math.min(70,W*.13));ctx.fillStyle='#ffd166';ctx.fillText(banner.b,W/2,H*.13+Math.min(70,W*.13));}
  if(hintT>0&&!isTouch){ctx.globalAlpha=Math.min(1,hintT);ctx.textAlign='center';ctx.font='700 16px system-ui,sans-serif';const h='HOLD ← → to lean   •   HOLD ↓ to duck (2 sec max)   •   DOUBLE-TAP ← → ↑ ↓ to jump to the next empty desk';ctx.strokeText(h,W/2,H-40);ctx.fillStyle='#fff';ctx.fillText(h,W/2,H-40);}
  ctx.restore();
}
// ---------- audio ----------
let AC,NB;
function audio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}catch(e){}}
function sfxWhoosh(v,dur){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
  f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2200,t+dur);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+dur*.6);g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur);}
function sfxThud(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);
  g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;const g2=AC.createGain();g2.gain.setValueAtTime(.6,t);g2.gain.exponentialRampToValueAtTime(.001,t+.12);
  s.connect(f);f.connect(g2);g2.connect(AC.destination);s.start(t);s.stop(t+.15);}
function sfxDing(){if(!AC)return;const t=AC.currentTime;[880,1320].forEach((fq,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.18,t+i*.08+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.4);o.connect(g);g.connect(AC.destination);o.start(t+i*.08);o.stop(t+i*.08+.45);});}
function sfxFart(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(60,t+.9);l.frequency.value=28;lg.gain.value=22;l.connect(lg);lg.connect(o.frequency);
  f.type='lowpass';f.frequency.value=420;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.04);g.gain.setValueAtTime(.5,t+.7);g.gain.exponentialRampToValueAtTime(.001,t+1);
  o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1);}
function sfxBell(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<6;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=1250;g.gain.setValueAtTime(.05,t+i*.12);g.gain.setValueAtTime(0,t+i*.12+.08);o.connect(g);g.connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.09);}}

// ---------- flow ----------
const ov=document.getElementById('ov'),card=document.getElementById('card');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function showTitle(){
  card.innerHTML='<h1 style="font-size:clamp(40px,8.5vw,80px)">ROETTINGER&rsquo;S<span>REVENGE</span></h1>'+
  '<div class="story">You&rsquo;re <b>Jackson</b>. It&rsquo;s the first day of first grade, and Mr.&nbsp;R is in a mood.<br>He ran out of chalk, but he still has a <b>whole stack of notebooks</b>.<br>Dodge <b>50</b> of them and the principal will finally show up…</div>'+
  (isTouch?'<div class="keys"><div>Hold ◀ ▶ to lean</div><div>Hold ▼ to duck (2 sec max)</div><div>Double-tap ◀ ▶ ▲ ▼ to switch desks</div><div>Grab poop and hit THROW from any desk. It flies straight ahead (yellow target), so time it for when he walks into it. 3 hits wins!</div><div>4 hits empties your health</div></div>'
  :'<div class="keys"><div><b>Hold</b> <kbd>←</kbd><kbd>→</kbd> to lean</div><div><b>Hold</b> <kbd>↓</kbd> to duck (max 2 seconds, then let go and press again)</div><div><b>Double-tap</b> <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> to switch desks</div><div>(WASD works too, or click the seat map)</div><div>Grab poop from desks and press <kbd>Space</kbd> to throw it straight ahead at the yellow target. Time it so he walks into it! <b>3 hits</b> and Mr.&nbsp;R is done!</div><div>Closer desks = more points</div><div>Grab health packs</div><div>4 hits empties your health</div></div>')+
  '<button id="go">START FIRST GRADE</button>'+(best?'<div class="sub" style="margin-top:16px">Best: '+best+'</div>':'');
  ov.classList.remove('hide');document.getElementById('go').onclick=start;
}
function start(){
  audio();sfxBell();
  books=[];parts=[];floats=[];score=0;dodged=0;hp=100;hpShown=100;playT=0;shuffleKids();seat=deskAt(2,0);SX=seat.x;SZ=seat.z-.75;moving=false;path=[];queued=null;pu=null;puT=9;poopPU=null;poopT=3;poopSeen=false;ammo=0;poops=[];duckT=0;duckLock=false;fartAt=12+Math.random()*45;farted=false;laughT=0;puffs=[];rHits=0;T.splats=[];level=1;streak=0;thrown=0;slow=1;T.angry=0;
  T.state='walk';T.t=1.6;T.combo=0;T.say='SIT DOWN, JACKSON.';T.sayT=1.4;hintT=9;
  P.x=0;P.y=STAND;state='play';ov.classList.add('hide');ov.classList.remove('soft');
  boardOtter=false;cheer=false;PRIN=null;OTTER=null;T.gone=false;T.saidWhat=false;T.x=0;T.z=7.1;
  document.getElementById('touch').style.display=isTouch?'flex':'none';
}
function gameOver(){
  state='over';slow=1;document.getElementById('touch').style.display='none';
  const nb=score>best;if(nb){best=score;try{localStorage.setItem('mrr_best',best)}catch(e){}}
  const msg=score<10?'Mr. R barely broke a sweat.':score<30?'Not bad. He\'s rubbing his shoulder.':score<60?'Mr. R needs an ice pack.':score<100?'He\'s considering early retirement.':'Legend. Mr. R has run out of notebooks.';
  card.innerHTML='<div class="sub" style="font-size:18px;margin:0 0 8px">&ldquo;Jackson, go to the principal&rsquo;s office!&rdquo;</div><h1 style="font-size:clamp(34px,7vw,60px)">SENT TO THE<span>PRINCIPAL</span></h1>'+
  '<div class="sub" style="margin:0">Jackson\'s score</div><div class="big">'+score+'</div><div class="sub">'+(nb?'🏆 New best!':'Best: '+best)+' • Level '+level+' • '+dodged+' dodged<br><br>'+msg+'</div>'+
  '<button id="go">TRY AGAIN</button>';
  ov.classList.remove('hide');document.getElementById('go').onclick=start;
}
// input
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'d',KeyS:'d',ShiftLeft:'d',ShiftRight:'d',ArrowUp:'u',KeyW:'u'};
const DIRS={l:[-1,0],r:[1,0],u:[0,1],d:[0,-1]},lastTap={};
function seatDir(dc,dr){
  if(state!=='play')return;
  let c=seat.col+dc,r=seat.row+dr;
  while(c>=0&&c<COLS.length&&r>=0&&r<ROWS.length){const d=deskAt(c,r);if(d&&!d.kid&&d!==seat){goSeat(d);return;}c+=dc;r+=dr;}
  // nothing straight ahead: nearest empty desk on that side
  let best=null,bd=1e9;for(const d of DESKS){if(d.kid||d===seat)continue;const ddc=d.col-seat.col,ddr=d.row-seat.row;
    if((dc&&Math.sign(ddc)!==dc)||(dr&&Math.sign(ddr)!==dr))continue;const dist=Math.abs(ddc)+Math.abs(ddr)*1.2;if(dist<bd){bd=dist;best=d;}}
  if(best)goSeat(best);else float('NO EMPTY DESK THAT WAY',W/2,H*.7,20);
}
function tapDir(k){if(k==='d'&&false)return;const now=performance.now();if(lastTap[k]&&now-lastTap[k]<320){lastTap[k]=0;seatDir(...DIRS[k]);}else lastTap[k]=now;}
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='KeyF')&&state==='play'){e.preventDefault();if(!e.repeat)throwPoop();return;}const k=KM[e.code];if(k){keys[k]=true;e.preventDefault();if(!e.repeat&&!e.code.startsWith('Shift'))tapDir(k);}if((e.code==='Enter'||e.code==='Space')&&state!=='play'&&state!=='dying'&&!ov.classList.contains('hide')){e.preventDefault();start();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{keys.l=keys.r=keys.d=false;});
for(const [id,k] of[['tL','l'],['tR','r'],['tDuck','d'],['tU','u']]){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=true;el.classList.add('on');tapDir(k);},off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
let mouse=null;
function deskUnder(mx,my){let best=null,bz=1e9;for(const d of DESKS){if(d===seat||d.kid||d.z-camZ<.5)continue;const c=pr(d.x,.72,d.z-.15),k=c[2];
  const ex=(mx-c[0])/(.42*k),ey=(my-c[1])/(.34*k);if(ex*ex+ey*ey<1&&d.z<bz){bz=d.z;best=d;}}return best;}
cv.addEventListener('pointermove',e=>{mouse=[e.clientX,e.clientY];});
cv.addEventListener('pointerleave',()=>{mouse=null;});
const tThrow=document.getElementById('tThrow');tThrow.addEventListener('pointerdown',e=>{e.preventDefault();throwPoop();});
let tap0=null;cv.addEventListener('pointerdown',e=>{mouse=[e.clientX,e.clientY];const md=mapHit(e.clientX,e.clientY);if(md){tap0=null;goSeat(md);return;}const d=deskUnder(e.clientX,e.clientY);if(!d){tap0=null;return;}const now=performance.now();
  if(tap0&&tap0.d===d&&now-tap0.t<450){tap0=null;goSeat(d);}else tap0={d,t:now};});
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();if(isTouch)tThrow.style.display=(state==='play'&&ammo>0)?'flex':'none';cv.style.cursor=(state==='play'&&mouse&&(deskUnder(mouse[0],mouse[1])||mapHit(mouse[0],mouse[1])))?'pointer':'default';requestAnimationFrame(loop);}
showTitle();requestAnimationFrame(loop);
})();
