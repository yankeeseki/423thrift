    return '<div class="ctt-cal-card special"><span class="ctt-cal-tag">' + esc(x.tag) + '</span><h4>' + esc(x.title) + '</h4><p class="ctt-cal-date">' + when + '</p>' + (x.note ? '<p>' + x.note + '</p>' : '') + '</div>';
  }
  function cellTitles(has) {
    if (!has.length) return '';
    var o = '<span class="ctt-cal-titles" aria-hidden="true">';
    has.slice(0, 2).forEach(function(x) { o += '<span>' + esc(x.kind === 'sale' ? x.sale.title : x.title) + '</span>'; });
    if (has.length > 2) o += '<span class="ctt-cal-more">+' + (has.length - 2) + ' more</span>';
    return o + '</span>';
  }
  function renderView() {
    var el = document.getElementById('ctt-cal-view'); if (!el) return;
    var t = today(), ty = +t.slice(0, 4), tm = +t.slice(5, 7) - 1;
    if (!calView) calView = { y: ty, m: tm };
    var y = calView.y, m = calView.m, rep = reported();
    var idx = (y - ty) * 12 + (m - tm), items = itemsForMonth(y, m);
    var dim = new Date(y, m + 1, 0).getDate(), lead = new Date(y, m, 1).getDay();
    var h = '<div class="ctt-cal-nav"><button type="button" class="ctt-cal-arrow" data-cal-nav="-1" aria-label="Previous month"' + (idx <= 0 ? ' disabled' : '') + '>&larr;</button><div class="ctt-cal-month" aria-live="polite">' + CAL_MONTHS[m] + ' ' + y + '</div><button type="button" class="ctt-cal-arrow" data-cal-nav="1" aria-label="Next month"' + (idx >= 14 ? ' disabled' : '') + '>&rarr;</button></div>';
    if (idx !== 0) h += '<div style="text-align:center;margin:-2px 0 6px"><button type="button" class="ctt-cal-today" data-cal-today="1">Back to this month</button></div>';
    h += '<div class="ctt-cal-grid" id="ctt-cal-grid" role="group" aria-label="' + CAL_MONTHS[m] + ' ' + y + '">';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d) { h += '<div class="ctt-cal-dow">' + d + '</div>'; });
    for (var i = 0; i < lead; i++) h += '<div class="ctt-cal-cell blank"></div>';
    for (var d = 1; d <= dim; d++) {
      var ds = ymd(y, m, d), has = items.filter(function(x) { return covers(x, ds); });
      var ev = has.some(function(x) { return x.kind === 'sale'; }), sp = has.some(function(x) { return x.kind !== 'sale'; });
      h += '<button type="button" class="ctt-cal-cell' + (ds === t ? ' today' : '') + (ds === calSel ? ' sel' : '') + '" data-day="' + ds + '" aria-label="' + CAL_MONTHS[m] + ' ' + d + (ds === t ? ', today' : '') + (has.length ? ', ' + has.length + (has.length === 1 ? ' listing' : ' listings') : '') + '"' + (ds === calSel ? ' aria-pressed="true"' : '') + '><span>' + d + '</span><span class="ctt-cal-marks" aria-hidden="true">' + (ev ? '●' : '') + (sp ? '◆' : '') + '</span>' + cellTitles(has) + '</button>';
    }
    h += '</div><div class="ctt-cal-legend"><span>● Community event</span><span>◆ Special day</span></div>';
    el.innerHTML = h; h = '';
    var shown = calSel ? items.filter(function(x) { return covers(x, calSel); }) : items;
    h += '<div class="ctt-cal-listhead"><span>' + (calSel ? pretty(calSel) : CAL_MONTHS[m]) + '</span>' + (calSel ? '<button type="button" class="ctt-cal-all" data-cal-all="1">Show all of ' + CAL_MONTHS[m] + '</button>' : '') + '</div>';
    if (!shown.length) h += '<p class="ctt-cal-empty">' + (calSel ? 'Nothing listed for this day.' : 'Nothing listed this month yet. Know of an event? Submit it above.') + '</p>';
    var cards = ''; shown.forEach(function(x) { cards += itemHtml(x, rep); }); if (cards) h += '<div class="ctt-cal-cards">' + cards + '</div>';
    document.getElementById('ctt-cal-list').innerHTML = h;
    [].forEach.call(body.querySelectorAll('[data-rep]'), function(b) { b.onclick = function() { report(b.getAttribute('data-rep')); }; });
    var g = document.getElementById('ctt-cal-grid'), x0 = null;
    g.addEventListener('touchstart', function(e) { x0 = e.touches[0].clientX; }, { passive: true });
    g.addEventListener('touchend', function(e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); }, { passive: true });
  }
  function go(n) {
    var t = today(), ty = +t.slice(0, 4), tm = +t.slice(5, 7) - 1;
    var idx = (calView.y - ty) * 12 + (calView.m - tm) + n;
    if (idx < 0 || idx > 14) return;
    var abs = tm + idx; calView = { y: ty + Math.floor(abs / 12), m: ((abs % 12) + 12) % 12 }; calSel = null; renderView();
  }
  body.addEventListener('click', function(e) {
    var b = e.target.closest('button'); if (!b || !body.contains(b)) return;
    if (b.hasAttribute('data-cal-nav')) go(+b.getAttribute('data-cal-nav'));
    else if (b.hasAttribute('data-day')) { var d = b.getAttribute('data-day'); calSel = calSel === d ? null : d; renderView(); var nb = body.querySelector('[data-day="' + d + '"]'); if (nb) nb.focus(); }
    else if (b.hasAttribute('data-cal-all')) { calSel = null; renderView(); }
    else if (b.hasAttribute('data-cal-today')) { calView = null; calSel = null; renderView(); }
  });
  function render() {
    var h = '<div id="ctt-cal-view"></div><div style="text-align:center"><button type="button" class="ctt-cal-add" id="ctt-cal-add" style="margin-top:12px">Submit your event</button></div><div id="ctt-cal-formwrap"></div><div id="ctt-cal-list"></div>';
    h += '<div class="ctt-shops-tip"><span>Enjoying the trail?</span><a href="https://venmo.com/derekp13" target="_blank" rel="noopener">Tip via Venmo</a><a href="https://cash.app/$derekp" target="_blank" rel="noopener">Tip via Cash App</a></div>';
    body.innerHTML = h;
    document.getElementById('ctt-cal-add').onclick = showForm;
    renderView();
  }
  function report(id) {
    var rep = reported(); if (rep[id]) return; rep[id] = 1;
    try { localStorage.setItem('ctt_reported_sales', JSON.stringify(rep)); } catch (e) {}
    var cur = sales.filter(function(x) { return x._id === id; })[0], n = ((cur && cur.reports) || 0) + 1;
    updateDoc(doc(db, 'sales', id), { reports: increment(1) }).then(function() { if (n >= 3) return deleteDoc(doc(db, 'sales', id)).catch(function() {}); }).catch(function() {});
    if (cur) { cur.reports = n; if (n >= 3) sales = sales.filter(function(x) { return x._id !== id; }); }
    window.cttTrack && cttTrack('report_sale'); renderView();
  }
  function showForm() {
    var w = document.getElementById('ctt-cal-formwrap'), t = today();
    w.innerHTML = '<form class="ctt-gi-form" id="ctt-cal-form" novalidate>' +
      '<p class="ctt-cal-sub"><strong>In-person events only.</strong> Every listing needs a real street address. No online or shipped sales.</p>' +
      '<label for="cs-title">What is it? (example: Church rummage sale or Grand opening)</label><input type="text" id="cs-title" maxlength="80">' +
      '<label for="cs-place">Street address</label><input type="text" id="cs-place" maxlength="120" placeholder="123 Main St">' +
      '<label for="cs-city">City</label><input type="text" id="cs-city" maxlength="60" value="Chattanooga">' +
      '<label for="cs-date">Date</label><input type="date" id="cs-date" min="' + t + '">' +
      '<label for="cs-end">Last day (only if it runs more than one day)</label><input type="date" id="cs-end" min="' + t + '">' +
      '<label for="cs-time">Hours (example: 8am to 2pm)</label><input type="text" id="cs-time" maxlength="40">' +
      '<label for="cs-details">Anything shoppers should know (optional)</label><textarea id="cs-details" maxlength="300"></textarea>' +
      '<label class="ctt-cal-check"><input type="checkbox" id="cs-ok"> <span>This event happens in person at the address above. It is not online.</span></label>' +
      '<div class="ctt-gi-hp" aria-hidden="true"><label>Leave blank<input type="text" id="cs-hp" tabindex="-1" autocomplete="off"></label></div>' +
      '<div class="ctt-gi-status" id="cs-status" role="status"></div><button type="submit" class="ctt-shops-back" id="cs-send">Post my event</button></form>';
    document.getElementById('ctt-cal-form').onsubmit = submit;
    document.getElementById('cs-title').focus();
  }
  function submit(e) {
    e.preventDefault();
    var st = document.getElementById('cs-status'), btn = document.getElementById('cs-send');
    function v(id) { return document.getElementById(id).value.trim(); }
    if (v('cs-hp')) return;
    var o = { title: v('cs-title'), place: v('cs-place'), city: v('cs-city'), date: v('cs-date'), endDate: v('cs-end') || null, time: v('cs-time'), details: v('cs-details'), reports: 0 };
    var all = [o.title, o.place, o.city, o.time, o.details].join(' ');
    var t = today(), max = new Date(Date.now() + 366 * 86400000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
    var err = '';
    if (o.title.length < 3 || o.place.length < 5 || o.city.length < 2 || !o.date) err = 'Please fill in what it is, a street address, the city and the date.';
    else if (!/\d/.test(o.place)) err = 'Please include a street number in the address. We only list in-person events.';
    else if (o.date < t || o.date > max) err = 'Please pick a date from today to a year from now.';
    else if (o.endDate && (o.endDate < o.date || o.endDate > max)) err = 'The last day needs to be on or after the first day.';
    else if (!document.getElementById('cs-ok').checked) err = 'Please confirm the event is in person.';
    else if (bad(all)) err = 'Please keep it family friendly.';
    else if (hasLink(all)) err = 'Please leave out web links and email addresses.';
    else { try { var last = +localStorage.getItem('ctt_sale_last') || 0; if (Date.now() - last < 60000) err = 'Please wait a minute before posting another.'; } catch (x) {} }
    if (err) { st.textContent = err; return; }
    btn.disabled = true; st.textContent = 'Posting...';
    o.createdAt = serverTimestamp();
    addDoc(collection(db, 'sales'), o).then(function() {
      try { localStorage.setItem('ctt_sale_last', String(Date.now())); } catch (x) {}
      window.cttTrack && cttTrack('submit_sale');
      load(function() { renderView(); var w = document.getElementById('ctt-cal-formwrap'); if (w) w.innerHTML = '<p class="ctt-gi-status" style="color:var(--olive)">Posted! Thank you. Your event is on the calendar.</p>'; });
    }).catch(function() { btn.disabled = false; st.textContent = 'Sorry, that did not post. Please try again in a moment.'; });
  }
  try {
    var app = getApps()[0] || initializeApp(cfg); db = getFirestore(app);
    load(function(ok) { calView = null; calSel = null; render(); if (!ok) body.insertAdjacentHTML('afterbegin', '<p class="ctt-cal-empty">Community events could not load right now. Special days are shown below.</p>'); });
  } catch (e) { render(); }
</script>
</body></html>
